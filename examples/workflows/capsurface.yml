name: capability surface

on:
  pull_request:
    paths:
      - '**/package.json'
      - 'package-lock.json'
      - 'capsurface.lock.json'
      - '.github/workflows/capsurface.yml'

permissions:
  contents: read
  # If comment-pr is enabled with a commit that supports it, also grant:
  # pull-requests: write
  # If upload-sarif is enabled below, also grant:
  # security-events: write
  # actions: read

# Serialize this review job per PR to avoid duplicate first comments.
concurrency:
  group: capsurface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capability-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install without running lifecycle scripts
        run: npm ci --ignore-scripts
      # Pin the Action to a reviewed commit, including its scanner. No npm
      # publication is needed and project-local binaries cannot shadow it.
      - uses: VictorMartins3/capsurface@922cae3e776b6e2a7460f1aec16c68a04673f948 # v0.1.0
        with:
          # Optional AST analysis; provisions pinned parsers with scripts disabled.
          deep: 'false'
          fail-on-new: 'true'
          # Start in observation mode; set false to enforce approvals.
          # Invalid/incomplete scans fail in either mode.
          report-only: 'true'
          # Enable only when Code Scanning is available in the repository
          # and security-events: write / actions: read are granted above.
          upload-sarif: 'false'
          # Optional downloadable reports; retention is 14 days.
          upload-artifact: 'false'
          # After pinning a reviewed commit containing PR comment support:
          # comment-pr: 'true'
          # comment-key: default

# Before adoption, commit an initial capsurface.lock.json on the target branch.
# The Action reads that baseline from the PR base SHA for Markdown/JSON/SARIF,
# then checks the proposed baseline separately. The job summary remains
# available when the capability gate fails. Artifact upload and PR comments are optional. Fork PRs use the job summary.
