name: capability surface

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capsurface.lock.json'

permissions:
  contents: read

jobs:
  capability-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Even a previously allowed package may ship a compromised update.
      # Inspect the new contents before allowing any install script to run.
      - name: Install without running lifecycle scripts
        run: npm ci --ignore-scripts

      # Pin the version. The ruleset decides what a baseline means, and
      # capsurface warns when the two disagree; floating this turns that
      # warning into noise on unrelated pull requests.
      - name: Scan the installed tree
        run: npx --yes capsurface@0.1.0 scan-tree node_modules --out .capsurface/manifests

      # Drop --report-only once the findings look like ones you want to
      # block on. Until then this runs, reports, and exits 0.
      - name: Check against the approved baseline
        run: npx --yes capsurface@0.1.0 check .capsurface/manifests --baseline capsurface.lock.json --report-only

      # The manifests say which file and line produced each finding, which
      # is what a reviewer needs and what the job log truncates.
      - name: Upload manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsurface-manifests
          path: .capsurface/manifests
          retention-days: 14

# A failure here means a dependency can do something it could not do when
# the baseline was approved: a new lifecycle script, new network, process
# execution, credential or filesystem access, a new literal endpoint, or a
# file the scanner can no longer read.
#
# Look at the named package and version before merging. If the change is
# legitimate, regenerate the baseline locally and commit it in the same
# pull request, so the approval is reviewed with the upgrade that caused it:
#
#     npx capsurface@0.1.0 scan-tree node_modules --out .capsurface/manifests
#     npx capsurface@0.1.0 baseline .capsurface/manifests --out capsurface.lock.json
#
# Renovate and Dependabot open one pull request per upgrade, which is what
# makes this readable: the diff of capsurface.lock.json sits next to the
# dependency change that produced it.
