name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run test:integration

  deep:
    name: optional AST analysis (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund acorn@8.15.0 acorn-typescript@1.4.13
      - run: npm run test:deep

  # The test runner needs Node 18; the shipped CLI claims Node 14. Prove it.
  floor:
    name: cli on the oldest supported node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 14
      - name: Scan the bundled fixture
        run: node bin/capsurface.js scan examples/malicious-pkg-v2 --out /tmp/m.json
      - name: Fail the gate on the compromised release
        run: |
          node bin/capsurface.js scan examples/malicious-pkg-v1 --out /tmp/base/pkg.json
          node bin/capsurface.js baseline /tmp/base --out /tmp/lock.json
          node bin/capsurface.js scan examples/malicious-pkg-v2 --out /tmp/cur/pkg.json
          if node bin/capsurface.js check /tmp/cur --baseline /tmp/lock.json; then
            echo "check passed on the compromised fixture, which is a regression"
            exit 1
          fi

      - name: Check optional AST mode on Node 14
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund acorn@8.15.0 acorn-typescript@1.4.13
          node bin/capsurface.js scan examples/malicious-pkg-v2 --deep --out /tmp/deep.json
          node -e "if (require('/tmp/deep.json').installContext.analysis !== 'ast-import-graph') process.exit(1)"
          node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const dir = fs.mkdtempSync(path.join(require('os').tmpdir(), 'capsurface-types-'));
          fs.writeFileSync(path.join(dir, 'package.json'), '{"name":"typed-smoke"}');
          fs.writeFileSync(path.join(dir, 'index.ts'), "const load = require as NodeRequire; load('child_process').exec('echo fixture');");
          const result = require('./lib/scanner').scanPackageDir(dir, { deep: true });
          if (!result.astCoverage.complete || !result.capabilities.exec.present || !result.capabilities.execShell.present) process.exit(1);
          const { tar, integrity } = require('./test/tarball-fixture');
          const archive = require('zlib').gzipSync(tar([
            { name: 'package/package.json', body: '{"name":"archive-smoke","version":"1.0.0"}' },
            { name: 'package/index.js', body: 'Object.keys(process.env);' }
          ]));
          fs.writeFileSync(path.join(dir, 'package.tgz'), archive);
          fs.writeFileSync(path.join(dir, 'map.json'), JSON.stringify({ 'https://registry.example/package.tgz': 'package.tgz' }));
          fs.writeFileSync(path.join(dir, 'lock.json'), JSON.stringify({ lockfileVersion: 3, packages: {
            '': {}, 'node_modules/archive-smoke': { version: '1.0.0', resolved: 'https://registry.example/package.tgz', integrity: integrity(archive) }
          } }));
          const scanned = require('./lib/lockfile-scan').scanLockfile(path.join(dir, 'lock.json'), path.join(dir, 'map.json'), path.join(dir, 'manifests'), { deep: true });
          if (scanned.count !== 1 || scanned.incomplete) process.exit(1);
          if (!require('./lib/snapshot').readManifests(path.join(dir, 'manifests'))[0].capabilities.envEnumeration.present) process.exit(1);
          JS

  review-action:
    name: dependency review action (deep=${{ matrix.deep }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deep: ['false', 'true']
    env:
      CAPSURFACE_DEEP: ${{ matrix.deep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install parsers for the deep baseline fixture
        if: matrix.deep == 'true'
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund acorn@8.15.0 acorn-typescript@1.4.13
      - name: Prepare a reviewed dependency upgrade
        id: fixture
        run: node test/action-fixture.js "$RUNNER_TEMP/review-fixture"
      - name: Verify the unapproved upgrade is blocked
        id: blocked
        continue-on-error: true
        uses: ./
        with:
          deep: ${{ matrix.deep }}
          project-directory: ${{ runner.temp }}/review-fixture
          base-ref: ${{ steps.fixture.outputs.base-sha }}
      - name: Assert the gate and approve the fixture
        env:
          OUTCOME: ${{ steps.blocked.outcome }}
          REVIEW_JSON: ${{ steps.blocked.outputs.json }}
        run: node test/action-fixture.js "$RUNNER_TEMP/review-fixture" approve
      - name: Verify the approved gate retains the target-branch review
        id: approved
        uses: ./
        with:
          deep: ${{ matrix.deep }}
          project-directory: ${{ runner.temp }}/review-fixture
          base-ref: ${{ steps.fixture.outputs.base-sha }}
          upload-artifact: 'true'
          artifact-name: capsurface-review-after-approval-deep-${{ matrix.deep }}
      - name: Assert approvals remain visible
        env:
          GATE: ${{ steps.approved.outputs.would-fail }}
          REVIEW_JSON: ${{ steps.approved.outputs.json }}
        run: node test/action-fixture.js "$RUNNER_TEMP/review-fixture" verify
      - name: Prepare incomplete deep coverage
        if: matrix.deep == 'true'
        run: node test/action-fixture.js "$RUNNER_TEMP/review-fixture" incomplete
      - name: Verify report-only rejects incomplete deep coverage
        if: matrix.deep == 'true'
        id: incomplete
        continue-on-error: true
        uses: ./
        with:
          deep: 'true'
          project-directory: ${{ runner.temp }}/review-fixture
          base-ref: ${{ steps.fixture.outputs.base-sha }}
          report-only: 'true'
      - name: Assert incomplete coverage cannot pass
        if: matrix.deep == 'true'
        env:
          OUTCOME: ${{ steps.incomplete.outcome }}
          REVIEW_JSON: ${{ steps.incomplete.outputs.json }}
        run: node test/action-fixture.js "$RUNNER_TEMP/review-fixture" verify-incomplete
