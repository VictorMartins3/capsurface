name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run test:integration

  # The test runner needs Node 18; the shipped CLI claims Node 14. Prove it.
  floor:
    name: cli on the oldest supported node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 14
      - name: Scan the bundled fixture
        run: node bin/capsurface.js scan examples/malicious-pkg-v2 --out /tmp/m.json
      - name: Fail the gate on the compromised release
        run: |
          node bin/capsurface.js scan examples/malicious-pkg-v1 --out /tmp/base/pkg.json
          node bin/capsurface.js baseline /tmp/base --out /tmp/lock.json
          node bin/capsurface.js scan examples/malicious-pkg-v2 --out /tmp/cur/pkg.json
          if node bin/capsurface.js check /tmp/cur --baseline /tmp/lock.json; then
            echo "check passed on the compromised fixture, which is a regression"
            exit 1
          fi

  review-action:
    name: dependency review action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare a reviewed dependency upgrade
        id: fixture
        run: node test/action-fixture.js "$RUNNER_TEMP/review-fixture"
      - name: Verify the unapproved upgrade is blocked
        id: blocked
        continue-on-error: true
        uses: ./
        with:
          project-directory: ${{ runner.temp }}/review-fixture
          base-ref: ${{ steps.fixture.outputs.base-sha }}
          artifact-name: capsurface-review-before-approval
      - name: Assert the gate and approve the fixture
        env:
          OUTCOME: ${{ steps.blocked.outcome }}
          REVIEW_JSON: ${{ steps.blocked.outputs.json }}
        run: |
          test "$OUTCOME" = failure
          node -e 'const fs = require("fs"); const {execFileSync} = require("child_process"); const r = JSON.parse(fs.readFileSync(process.env.REVIEW_JSON)); if (!r.wouldFail || r.entries.length !== 1) process.exit(1); execFileSync(process.execPath, ["bin/capsurface.js", "approve", require("path").join(require("path").dirname(process.env.REVIEW_JSON), "manifests"), "--baseline", process.env.RUNNER_TEMP + "/review-fixture/capsurface.lock.json", "--id", r.entries[0].id, "--reason", "Reviewed the test fixture"], {stdio: "inherit"});'
      - name: Verify the approved gate retains the target-branch review
        id: approved
        uses: ./
        with:
          project-directory: ${{ runner.temp }}/review-fixture
          base-ref: ${{ steps.fixture.outputs.base-sha }}
          artifact-name: capsurface-review-after-approval
      - name: Assert approvals remain visible
        env:
          GATE: ${{ steps.approved.outputs.would-fail }}
          REVIEW_JSON: ${{ steps.approved.outputs.json }}
        run: |
          test "$GATE" = false
          node -e 'const r = require(process.env.REVIEW_JSON); if (!r.wouldFail || r.entries.length !== 1 || r.entries[0].provenance.status !== "resolved") process.exit(1);'
